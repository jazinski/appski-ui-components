name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Changesets Release
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Create Release Pull Request or Version
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run tag-release
          commit: "chore(release): version package"
          title: "chore(release): version package"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ vars.RELEASE_BOT_NAME || 'github-actions[bot]' }}
          GIT_AUTHOR_EMAIL: ${{ vars.RELEASE_BOT_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}
          GIT_COMMITTER_NAME: ${{ vars.RELEASE_BOT_NAME || 'github-actions[bot]' }}
          GIT_COMMITTER_EMAIL: ${{ vars.RELEASE_BOT_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}
